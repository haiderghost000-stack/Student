kind = "web"
previewPath = "/"
title = "مساحة الطالب"
description = "مساحة دراسة عربية تساعد الطلاب على تنظيم المهام والملاحظات وجلسات التركيز، وقراءة ملفات PDF، والاستراحة بألعاب خفيفة."
version = "1.0.0"
id = "artifacts/student-study-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24710

[services.development]
run = "pnpm --filter @workspace/student-study-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/student-study-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/student-study-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24710"
BASE_PATH = "/"
